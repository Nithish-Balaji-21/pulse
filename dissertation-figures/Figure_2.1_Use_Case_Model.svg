<line x1="108" y1="62" x2="235" y2="62" class="ln"/><line x1="108" y1="68" x2="235" y2="112" class="ln"/>
<line x1="108" y1="212" x2="235" y2="205" class="ln"/><line x1="108" y1="218" x2="235" y2="255" class="ln"/>
<line x1="108" y1="352" x2="235" y2="345" class="ln"/><line x1="108" y1="358" x2="235" y2="395" class="ln"/>
<line x1="108" y1="500" x2="235" y2="470" class="ln"/><line x1="108" y1="506" x2="235" y2="520" class="ln"/><line x1="108" y1="512" x2="235" y2="568" class="ln"/>
<line x1="108" y1="670" x2="235" y2="650" class="ln"/><line x1="108" y1="676" x2="235" y2="700" class="ln"/><line x1="108" y1="682" x2="235" y2="748" class="ln"/>
<!-- associations: right actors -->
<line x1="792" y1="92" x2="665" y2="66" class="ln"/><line x1="792" y1="98" x2="665" y2="115" class="ln"/><line x1="792" y1="104" x2="665" y2="163" class="ln"/>
<line x1="772" y1="340" x2="665" y2="307" class="ln"/><line x1="772" y1="347" x2="665" y2="355" class="ln"/><line x1="772" y1="354" x2="665" y2="403" class="ln"/>
<line x1="772" y1="577" x2="665" y2="585" class="ln"/>
