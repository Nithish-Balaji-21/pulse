<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470">
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:11.5px;fill:#000}
.n{fill:#fff;stroke:#000;stroke-width:1.2}
.g{fill:#f0f0f0;stroke:#000;stroke-width:1.2}
.grp{fill:none;stroke:#000;stroke-width:1;stroke-dasharray:6,4}
.t{font-weight:bold;font-size:12px}
.s{font-size:10.5px}
.i{font-size:10.5px;font-style:italic}
.f{stroke:#000;stroke-width:1.1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z"/></marker></defs>
<rect x="340" y="10" width="200" height="44" class="g"/><text x="440" y="30" text-anchor="middle" class="t">Login</text><text x="440" y="46" text-anchor="middle" class="s">active factory resolved</text>
<line x1="440" y1="54" x2="440" y2="80" class="f" marker-end="url(#a)"/>
<rect x="20" y="80" width="840" height="78" class="grp"/><text x="30" y="96" class="i">Top navigation bar - factory and account functions</text>
<rect x="35" y="105" width="150" height="40" class="n"/><text x="110" y="129" text-anchor="middle">Factory switcher</text>
<rect x="200" y="105" width="150" height="40" class="n"/><text x="275" y="122" text-anchor="middle">Superadmin menu</text><text x="275" y="137" text-anchor="middle" class="i">superadmin only</text>
<rect x="365" y="105" width="150" height="40" class="n"/><text x="440" y="129" text-anchor="middle">Factory settings</text>
<rect x="530" y="105" width="150" height="40" class="n"/><text x="605" y="129" text-anchor="middle">Notification inbox</text>
<rect x="695" y="105" width="150" height="40" class="n"/><text x="770" y="129" text-anchor="middle">Profile and account</text>
<line x1="440" y1="158" x2="440" y2="184" class="f" marker-end="url(#a)"/>
<rect x="20" y="184" width="840" height="275" class="grp"/><text x="30" y="200" class="i">Collapsible sidebar - operational modules</text>
<rect x="35" y="212" width="190" height="56" class="n"/><text x="130" y="236" text-anchor="middle" class="t">Dashboard</text><text x="130" y="254" text-anchor="middle" class="s">production, machines, water</text>
<rect x="245" y="212" width="190" height="56" class="n"/><text x="340" y="236" text-anchor="middle" class="t">IoT Insights</text><text x="340" y="254" text-anchor="middle" class="s">pith, bales, blocks, water</text>
<rect x="455" y="212" width="190" height="56" class="n"/><text x="550" y="236" text-anchor="middle" class="t">Assets</text><text x="550" y="254" text-anchor="middle" class="s">issue and return</text>
<rect x="665" y="212" width="180" height="56" class="n"/><text x="755" y="236" text-anchor="middle" class="t">Reports</text><text x="755" y="254" text-anchor="middle" class="s">inventory, payroll, production</text>
<rect x="35" y="290" width="260" height="110" class="n"/><text x="165" y="312" text-anchor="middle" class="t">Production</text><text x="165" y="334" text-anchor="middle">Pith Production</text><text x="165" y="352" text-anchor="middle">Fibre Bales</text><text x="165" y="370" text-anchor="middle">Pith Blocks</text><text x="165" y="390" text-anchor="middle" class="i">growbag factories: Production (growbags)</text>
<rect x="310" y="290" width="260" height="110" class="n"/><text x="440" y="312" text-anchor="middle" class="t">Inventory</text><text x="440" y="334" text-anchor="middle">Pith Inventory</text><text x="440" y="350" text-anchor="middle" class="s">locations, transfers, watering, closing</text><text x="440" y="372" text-anchor="middle">Husk Inventory</text><text x="440" y="388" text-anchor="middle" class="s">daily husk ledger</text>
<rect x="585" y="290" width="260" height="110" class="n"/><text x="715" y="312" text-anchor="middle" class="t">Operations</text><text x="715" y="334" text-anchor="middle">Staff Attendance</text><text x="715" y="350" text-anchor="middle" class="s">hours and wages</text><text x="715" y="372" text-anchor="middle">Weather</text><text x="715" y="388" text-anchor="middle" class="s">forecasts and drying advice</text>
<text x="440" y="430" text-anchor="middle" class="i">Items appear only when the factory has the product module enabled</text>
<text x="440" y="447" text-anchor="middle" class="i">and the user's role grants the view permission.</text>
</svg>
